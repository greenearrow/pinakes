# pinakes-agent configuration: one file per machine. Copy to /etc/pinakes/agent.toml (or
# ~/.config/pinakes/agent.toml for a per-user agent) and edit. Nothing site-specific lives in the code.
# Owners are not set here: the server decides them (server.example.toml, [ownership]).

[agent]
host = "server-1"                      # this machine's name in the catalog
state = "/var/lib/pinakes/state.sqlite"
outbox = "/var/lib/pinakes/outbox"
# scrub = "/etc/pinakes/scrub.toml"    # the scrub file (DESIGN.md "Scrub"); by default scrub.toml beside this file.
                                       # The agent writes it, one block per filesystem under the roots (days = 30:
                                       # every file read again and its hash checked once a month); edit the numbers
# scrub_max_minutes = 60               # end a run's scrub after this long, whatever is left of its share

[schedule]
only_on_ac = false                     # laptops: true
busy_command = ""                      # skip this run while the command exits 0, e.g. "pgrep -x some-game"

[transport]
# "ssh": send each batch to a command on the catalog server that accepts batches and nothing else.
# "directory": drop batches into a folder the ingester reads (for an agent on the catalog server itself).
kind = "ssh"
target = "pinakes@server-1"         # user@host; the key is forced to the ingest command there
identity = "/var/lib/pinakes/id_ed25519"
timeout = 600                          # seconds to wait for the server to apply one batch
# kind = "directory"
# path = "/srv/pinakes/inbox"

# One [[root]] per scanned folder.
# This example shows one root of every kind; a real machine lists only its own, and the server's [hosts] says
# which host may report which root (server.example.toml).

[[root]]
label = "store"
path = "/mnt/store"
kind = "primary"
archives = true                        # list zip and tar members
metadata = true                        # extract every schema that applies (the default); false, or a list: ["exif"]
manifests = true                       # check SHA256SUMS and *.sha256 files against the scan's hashes (the default)
exclude = ["**/lost+found", "**/.Trash-*"]
managed = ["move", "rename", "write-sidecar", "trash"]   # what approved operations may do here; [] for none

[[root]]
label = "store-writing"
path = "/mnt/store/people/user-1/writing"
kind = "primary"
protected = true                       # hashes only: no archives, no metadata, no previews; not in MCP tokens
chunks = { enabled = true }            # chunk hashes are allowed on protected roots: they say nothing readable

[[root]]
label = "store-snapshots"
path = "/mnt/backup/snapshots"
kind = "backup"
mirrors = { root = "store", layout = "*/{relpath}" }   # each snapshot folder holds the source's tree
# a backup of one folder of the source: mirrors = { root = "store", layout = "*/{relpath}", prefix = "games/world-1" }

[[root]]
label = "downloads"
path = "/home/user/Downloads"
kind = "drop"
chunks = { enabled = true, min_size = "64KiB", max_size = "2GiB", average = "256KiB" }
exclude = ["**/*.part", "**/*.crdownload"]
