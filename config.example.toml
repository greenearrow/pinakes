# catalog-agent configuration: one file per machine. Copy to /etc/file-catalog/agent.toml (or
# ~/.config/file-catalog/agent.toml for a per-user agent) and edit. Nothing site-specific lives in the code.

[agent]
host = "workstation-1"                 # this machine's name in the catalog
state = "/var/lib/file-catalog/state.sqlite"
outbox = "/var/lib/file-catalog/outbox"

[schedule]
only_on_ac = false                     # laptops: true
busy_command = ""                      # skip this run while the command exits 0, e.g. "pgrep -x some-game"
nice = 19
ionice_class = 3                       # idle

[transport]
# "ssh": send each batch to a command on the catalog host that accepts batches and nothing else.
# "directory": drop batches into a folder the ingester reads (for an agent on the catalog host itself).
kind = "ssh"
target = "catalog@server-1"            # user@host; the key is forced to the ingest command on the server
identity = "/var/lib/file-catalog/id_ed25519"
# kind = "directory"
# path = "/srv/file-catalog/inbox"

# One [[root]] per scanned folder.
[[root]]
label = "store"
path = "/mnt/store"
kept = true                            # copies here count for "safe to delete"
archives = true                        # list zip and tar members
exclude = ["**/lost+found", "**/.Trash-*"]

[[root]]
label = "store-writing"
path = "/mnt/store/writing"
kept = true
protected = true                       # hash only: no chunks, no archive listing, nothing derived from content

[[root]]
label = "downloads"
path = "/home/user/Downloads"
kept = false                           # a drop folder
chunks = { enabled = true, min_size = "64KiB", max_size = "2GiB", average = "256KiB" }
exclude = ["**/*.part", "**/*.crdownload"]
