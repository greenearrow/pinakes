[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinakes"
version = "0.1.0.dev0"
description = "A catalog of every file on every machine in a home lab, and of who owns it"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = []                      # the agent is standard library only (plus tomli on 3.10)

[project.optional-dependencies]
agent310 = ["tomli>=1.2"]
server = ["psycopg[binary]>=3.1", "flask>=3.0", "waitress>=3.0"]
mcp = ["mcp>=1.0"]
# development only, never on a machine that runs pinakes: the server's packages for the tests, build for --wheel,
# uv for the matrix's environments (tools/test)
dev = ["pinakes[server]", "build>=1.2", "uv>=0.5"]

[project.scripts]
pinakes-agent = "pinakes.agent:main"
pinakes-ingest = "pinakes.ingest:main"
pinakes = "pinakes.cli:main"
pinakes-web = "pinakes.web:main"

[tool.setuptools]
packages = ["pinakes"]

[tool.setuptools.package-data]
pinakes = ["schema.sql", "upgrades/*.sql", "patterns/*.toml", "templates/*.html", "static/*"]
