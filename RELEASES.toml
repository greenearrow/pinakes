# Every release of pinakes, oldest first. A release is cut deliberately, by tagging its commit release-ID (git tag);
# a commit alone never makes one. An entry without its tag is being prepared: nothing counts it as a release, and
# tools/latest-release ROLE, which prints the newest cut release that changes ROLE, leaves it out.
# tests/test_releases.py checks this file.
#
#   id                   1, 2, 3, ...: one more than the entry before
#   affects              what must be reinstalled for it: any of "server" (ingester, web UI, schema), "agent", "cli";
#                        a web-only change affects only "server"
#   protocol             the batch format, agent state and catalog schema together, as pinakes/compat.py has it;
#                        0: before check-in, when nothing was declared
#   min_agent_protocol   the oldest agent the server accepts
#   min_server_protocol  the oldest server the agent sends to
#   upgrade_sql          the pinakes/upgrades/*.sql a catalog from the release before needs, in order, run once as the
#                        schema's owner before the server is updated; [] for none
#   fingerprint          (from protocol 1) the batch fields, state and schema the protocol stands for: the tests
#                        fail if the code changes them and keeps the protocol (they print the new values)
#   version              (from release 13) its semantic version, MAJOR.MINOR.PATCH, above the release before's;
#                        pinakes.__version__ and the package's version are the newest entry's. MAJOR when something
#                        that worked stops working until a person does more than update: min_agent_protocol or
#                        min_server_protocol raised, or a command, API call, page or setting changed or removed (a
#                        --json shape too). MINOR when anything is added: a command, option, API call or answer
#                        field, a page, a compatible protocol, an upgrade file. PATCH for fixes only. While MAJOR is 0
#                        (until publishing is decided), what would raise MAJOR raises MINOR. The id stays what agents,
#                        servers and tools compare; the version is for people and packages. A cut release has a
#                        second tag, vVERSION, on the same commit as release-ID.
#   note                 what it is
#
# Releases 1 and 2 are the two already live when releases began, backfilled so the first check shows no drift: the
# first deployment's server runs release 1, its agents release 2. Both are protocol 0: they declare nothing, and a
# server with check-in accepts their batches as protocol 0.

