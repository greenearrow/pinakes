fingerprint = { batch = "0bc0a335cd9c0eee", state = "8e00d0bee11dbeda", schema = "b47072883b3eb461" }
note = "Sequence resets refused, not swallowed, and followed at check-in (pinakes-agent renumber by hand); a complete scan --full retires what it didn't send; pinakes-ingest retire-root; both shown by pinakes --versions and /health. The JSON API (/api/v1/) and person tokens, made and revoked on the account page (ROADMAP 34); pinakes, the command, is its client on any machine, by token, with no database access (35): pinakes --backups is now pinakes backups; its commands take a path here or the current folder, and bare pinakes sums up the folder (33); only-here, safe-to-delete and backed-up given a file answer for it, on the web too; --as NAME signs in as NAME for one command, by their password and second factor or a token of theirs (36); pinakes review intended|restore [PATH] marks changes from a folder, with a token's review scope, and mark_changes() holds to a token's scope and roots (37); pinakes releases, with an operator's ops token, replaces pinakes --versions, which now only says so: a site's deploy checks change with this release (39); group tokens act as a group and no member, made and revoked by its members on the account page, its marks the group's (38)."

[[release]]
id = 6
affects = ["server", "agent", "cli"]
protocol = 3
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = ["scrub.sql", "files-policy.sql", "owner-by-uid.sql", "unreported-roots.sql"]
fingerprint = { batch = "5cbe1c6ad9b67bdc", state = "03e186ed59791806", schema = "579f970f49ff77e0" }
note = "The scrub (ROADMAP 41): after the scans, each filesystem's files read again over `days` (scrub.toml, written by the agent: 30 by default, 0 for network filesystems; the person's numbers never changed), a changed hash under an unchanged size and mtime reported as a mismatch and a read error as unreadable, both reviewable and on the restore list, an unreadable file no copy until it reads; pinakes-agent scrub [status]; /health says when a host's scrub is behind. The agent scrubs only once its server answers protocol 3, so either side may be updated first. The home page faster on a large catalog (ROADMAP 48): the files policy evaluates visible_acls() once per query (files-policy.sql), and every root is counted in one pass. Owner rules by uid (ROADMAP 2, owner-by-uid.sql): a rule with owner = \"uid\" gives a folder's files to whoever the root's host's uid_map names for each file's uid, a chown moves the file, and a uid the map doesn't name falls to the next rule. A machine replaced under the same name (ROADMAP 46, unreported-roots.sql): every batch names the agent's roots, and a root of its host that the batches leave out shows in /health (503 \"roots unreported\", a count per host), in pinakes releases, and by label in pinakes-ingest totals with the retire-root to run, until a batch names it again or it is retired. The account page's token forms can be filled by a password manager, and show their result by the form (ROADMAP 49)."

[[release]]
id = 7
affects = ["server", "agent", "cli"]
protocol = 4
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = ["manifests.sql", "extractions.sql"]
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "4c0d56523e6ef0f1" }
note = "Checksum manifests (ROADMAP 19): at the end of each scan the agent checks every SHA256SUMS (also SHA256SUMS.txt, *.sha256) in the root against its own hashes, reading a manifest only when its content is new, and sends per listed file whether its line is confirmed or wrong, and per manifest its counts (confirmed, wrong, missing, unchecked, unreadable, outside its root), with the scan's complete batch and only when they change; never on a protected root or link, nor with hash = \"none\"; [[root]] manifests = false turns it off. A manifest is a hint: no hash is taken from it. The catalog keeps the verdicts on the files, under the files policy (manifests.sql); the file page shows them, and the Manifests report, /api/v1/manifests and pinakes manifests [PATH] list the files with another hash and the manifests naming files not there. The agent checks only once its server answers protocol 4, so either side may be updated first. Extraction outcomes (ROADMAP 44, extractions.sql): per file and schema the agent sends what the extractor made of it, values, nothing, refused with a reason code (truncated, wrong_type, malformed, bad_values, unreadable, failed) or skipped (dependency, broken), never an error's text; a JPEG that ends before its image data is refused as truncated. The catalog keeps one outcome per content and schema, under row-level security (values found that are all sensitive read as nothing to whoever may not see them); the file page shows them and pinakes-ingest extractions counts them without names. Once its server answers protocol 4 the agent reads every file with an extractor once more (headers only, no rehash) to send their outcomes. Folders that are copies of each other (ROADMAP 43): pinakes folder-copies [FOLDER] and /api/v1/folder-copies list folders that are the same as another, inside a bigger one, or nearly the same (at most 10% other content, the paths named), computed per call under row-level security; no web page yet (ROADMAP 50). pinakes-ingest totals prints an unreported root's date as UTC's (a fix to release 6)."

[[release]]
id = 8
affects = ["server", "agent"]
protocol = 5
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = ["operator.sql"]
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "78c159405258792d" }
note = "The operator page (ROADMAP 10): /operator, for an operator signed in on the web, every root's files and bytes, last complete scan, scrub, reporting state and scan errors, as counts and dates without a path or a person. What a disk's loss would cost (ROADMAP 42): the files with no copy on another disk, per device and per host (if the machine were lost); totals on the operator page, and on the If a disk failed report a person's own, by top folder with names, largest first (operator.sql). A web page for folder copies (ROADMAP 50): /reports/folder-copies?loc=ROOT:PATH, the same query as pinakes folder-copies, sortable and paged, audited in a step-up. Growth by folder over time (ROADMAP 47): /reports/growth, per root and folder, per week, the files and bytes that came and went, a root's first scan not counted, audited in a step-up. A person's export of their own records (ROADMAP 45): GET /api/v1/export with a person's read token, their files, history, reviews, metadata and lineage, as JSON or one part as CSV, under row-level security and recorded. The agent reports its runs to a push monitor (ROADMAP 51): [monitor] url_file in agent.toml, a file holding the push URL; every run, by timer or by hand, ends by calling it, up with counts, down with the reasons; a failed report is one line without the URL and never changes the exit status. Off without the setting. Protocol 5 changes the schema only: agents of protocol 0 to 4 work with it unchanged, and this agent with any server."

[[release]]
id = 9
affects = ["server", "cli"]
protocol = 5
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = []
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "78c159405258792d" }
note = "A root's first scan is not a change (ROADMAP 52): the Changes page, /api/v1/changes and pinakes changes leave out the new files of a root's first scan, as Growth does, which made the page slow for a week after a root's first scan on a large catalog; a file's own history still shows it. What the server answered that pinakes didn't ask (ROADMAP 53 to 59): pinakes whoami, export [PART] [--csv], at-risk, growth [FOLDER] [--weeks N], restores [PATH] [--back], access, and changes --tree [--depth N] --what KIND --review reviewed|unreviewed; new API calls at-risk, growth, restores, change-tree and access (a person's token only), under row-level security and the token's roots, recorded like every call, refused to ops tokens."

[[release]]
id = 10
affects = ["server", "agent", "cli"]
protocol = 6
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = ["lineage-decisions.sql", "person-metadata.sql", "edits.sql"]
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "c7c0a957cf2a2728" }
note = "Lineage decisions (ROADMAP 9, lineage-decisions.sql): confirm, reject or clear the link between a file and a direct relative, on the file page (Direct relatives), through POST /api/v1/decide and with pinakes relatives FILE --confirm|--reject|--clear OTHER; GET /api/v1/relatives and pinakes relatives FILE list a file's direct relatives both ways, rejected ones too. A decision covers every edge between the two files but a certain one (the same content: the hash decides), and outranks every heuristic: a rejected pair leaves the walks and is never suggested again by a scan or tidy, either way round; a confirmed edge survives tidy. Only the owner or a co-owner of the later file decides, or an administrator in a step-up; a decision touching another person's file is audited for them. Never under a group token; a token needs the review scope. Identity fields in lineage (ROADMAP 15): files whose XMP DocumentID or InstanceID match, or whose DerivedFrom names the other, are linked with certainty (derived_from), whatever their names; schemas name such fields with identity and parent; run pinakes-ingest tidy after the update to link the files ingested before it (an undecided name edge it replaces goes). Person-entered metadata and shared sensitive fields (ROADMAP 16, person-metadata.sql): on a file's page its owner, a co-owner or an annotator sets or removes their own value of any field of a schema that fits the file, kept on the file (it follows moves) with its author, sensitive fields apart; entering on another person's file is audited for its owners. The owner or a co-owner shares the file's sensitive fields (GPS, people shown, places) with one of its readers or annotators, who then sees them, and stops; audited for that person and the other owners. Sharing on the web only, refused under every token. Tagging from a folder (ROADMAP 37): pinakes tag [PATH] --add TAG --remove TAG --note TEXT sets a person's own tags (dc.subject) and note (dc.description) on the file or on every file under the folder they own, co-own or annotate, shown and asked first (--yes without); without an option it lists the tags and notes there; new API calls GET tags (scope read or tag) and POST tag (scope tag, a person's token); set_file_metadata() takes a person's token with the tag scope, in its roots, never a group token. Scrub (agent): each file scrubbed is looked up by files_inode; on a filesystem holding one root SQLite searched the whole root for it instead, so a scrub of many small files ran at a few files a second. Paged answers with counts (ROADMAP 61): every list call of the API answers a page (100 rows, limit= up to 10000, offset=) with the whole list's total; export a page of each part; the pinakes commands that list take --limit and --offset and say N of TOTAL, their --json is {rows, total, limit, offset} (scripts that read a list need .rows), and review, tag and export ask every page, so an older pinakes against this server sees only the first page: update both. The web turns JIT off on its connections; meta and folder copies are fast on a large catalog. A history of the catalog's own writes (ROADMAP 62, edits.sql): every review mark, lineage decision and person-entered value (tags, notes) written from then on is kept as an edit with who made it, by which token or on the web, when, and the values before; pinakes edits [--token CLIENT] [--days N] lists a person's own and their groups', and pinakes undo EDIT... puts back the values before, refused where a value changed since (naming the later edit) or the person may no longer write it; new API calls GET edits and POST undo; an undo is an edit too, audited like the write. The account page's token form says what an assistant receives: whoever runs it gets the file names, paths and metadata its answers return (SECURITY.md \"The MCP server\"), and its scopes' note names the commands that use review and tag. Protocol 6 changes the schema only: agents of protocol 0 to 5 work with it unchanged."

[[release]]
id = 11
affects = ["server"]
protocol = 6
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = []
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "c7c0a957cf2a2728" }
note = "pinakes-ingest tidy finishes on a large catalog: its backup-lineage DELETE (an edge from or to a file in a backup root) ran as a SubPlan over every backup file, rescanned for each lineage row, and didn't finish in an hour on 3.5 M files; each edge column now has its own DELETE, a join on its index, and the empty-file DELETE likewise. A test checks that no plan of tidy's set-wide statements has a SubPlan. The server only: no schema change, no upgrade file."

[[release]]
id = 12
affects = ["server"]
protocol = 6
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = []
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "c7c0a957cf2a2728" }
note = "pinakes changes answers on a root with tens of thousands of gone files: it counts every matching row, and the copy lookup (elsewhere, elsewhere_at, backups) sat under that count, so it ran for every gone file in the window, not the page; a root's 30 days of 193 k history rows on a 3.4 M-file catalog took 4 s without it and was cancelled at 300 s with it. The page is now cut first and the copies looked up for its rows only; the changes page's mark-all option for gone files still in another root filters by EXISTS. Rows and order unchanged. [web] statement_timeout (default 55s, 0: none): a query running past it is stopped in the database and answered 503 with what to ask for instead, so a call the command gave up on at 60 s no longer holds a thread and the database, blocking everybody's calls for minutes. The server only: no schema change, no upgrade file."

[[release]]
id = 13
version = "0.13.0"
affects = ["server", "cli"]
protocol = 6
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = []
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "c7c0a957cf2a2728" }
note = "The first release with a semantic version (0.13.0: something added). How many of all the files have a backup: backed-up is sorted unbacked first, so page 1 of a folder mostly backed up showed only zeros and read as nothing backed up. The query counts the files with at least one copy over the whole list; GET /api/v1/backed-up answers with_backup and without_backup beside total, pinakes backed-up prints \"N of TOTAL file(s) have a backup; M have none.\" first (against an older server, no line), and the Backed up report says it above the table (no line on an empty page). The server and the CLI: no schema change, no upgrade file."

[[release]]
id = 14
version = "0.14.0"
affects = ["server", "cli"]
protocol = 7
min_agent_protocol = 0
min_server_protocol = 0
upgrade_sql = ["placeholders.sql", "metadata-nocase.sql"]
fingerprint = { batch = "099342d9ac728abd", state = "11155534073777cb", schema = "b7d6f3e888d9ec2a" }
note = "Placeholders (ROADMAP 69, placeholders.sql): an app's default bytes held under many names (the same minimal sidecar beside every photo, the objects a game writes with nothing stored in them) are no longer copies of one another. pinakes placeholders lists the candidates (contents of at most [placeholders] max_size bytes, 64 KiB, held under min_names names or more, 3, outside backup roots), under row-level security; pinakes placeholders FILE a file's likely siblings (its extension, a size within siblings_within, 20%); --marked the placeholders there are. pinakes placeholder FILE [--siblings] [--unmark] marks a content (POST /api/v1/placeholder), only where every file holding it is the person's own or co-owned, or an administrator in a step-up (audited); a token needs the review scope and every holder in its roots; never a group token. [[placeholders.rule]] in server.toml (name, ext, max_size, min_names, min_folders) makes a matching content a placeholder without a mark, at each scan for the contents it touched and for every content by pinakes-ingest tidy, which also drops what a removed rule made. A placeholder gets no copy link by its hash (other rules may still link its files), the ones made before are left out of lineage and relatives (kept, so an unmark brings them back), and its other holders aren't copies for only-here, safe-to-delete, where, folding, dupes, folder-copies, at-risk and the operator's totals (at_risk() replaced); a backup of the file itself still is. pinakes find --hide-placeholders (find?placeholders=hide) leaves their files out and counts them (placeholders_hidden). The web: a Placeholders page (candidates, placeholders, a file's siblings, marked by ticking), a file's page saying whether it is one with a button to mark or unmark it, and Leave out placeholders in browse and find, for the session, counting what it leaves out. find (the command, the API and the web) of a name with _ or % and no * or ? found only a file of exactly that name: LIKE's escaped _ and % were taken for wildcards; now it is found anywhere in a name, as any other. meta without knowing the exact value (ROADMAP 70, metadata-nocase.sql): pinakes meta SCHEMA.FIELD lists the field's values with how many files hold each (GET /api/v1/meta-values), text one value whatever its case, a date per day; SCHEMA.FIELD=VALUE matches text without case and trimmed, through a new index kind (ci) for every exact text field, and a date field by YYYY, YYYY-MM or YYYY-MM-DD; more than one FIELD=VALUE (field= and value= again, in pairs) lists the files meeting every one; under row-level security as before. What a meta answer can't see (ROADMAP 71): EXIF and XMP are read from JPEG only, so under a meta answer, of a value or a field's values, a line says how many other image files (by suffix: raw, PNG, TIFF, HEIC and the like) the person sees outside backups aren't searched, counted under row-level security; --json and both API calls carry it as not_searched ({schemas, read_from, files, note}), and the web's find by a date or a maker says it too. only-here with nothing to list says why (ROADMAP 74): \"none: all N files under FOLDER have a copy on another disk\", or \"no file you can see under FOLDER\", with the root's last complete scan; the API's only-here carries files (counted under row-level security, symlinks left out) and last_complete_on, and the web's Only here says the same. Run placeholders.sql and metadata-nocase.sql, then pinakes-ingest setup (the ci indexes) and pinakes-ingest tidy. Protocol 7 changes the schema only: agents of protocol 0 to 6 work with it unchanged."
