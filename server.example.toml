# pinakes-ingest and pinakes-web configuration, on the catalog server. Copy to
# /etc/pinakes/server.toml and edit. Secrets (database password, session key) are not kept here:
# each line names a file readable only by the service.

[database]
dsn = "postgresql://pinakes_ingest@localhost/pinakes"   # the ingester: bypasses row-level security
password_file = "/etc/pinakes/secrets/ingest-db-password"

[web]
dsn = "postgresql://pinakes_app@localhost/pinakes"   # the web UI and CLI's role: row-level security applies
password_file = "/etc/pinakes/secrets/app-db-password"
listen = "127.0.0.1:8080"              # behind the site's HTTPS reverse proxy
behind_proxy = true                    # read the visitor from X-Forwarded-For (one proxy hop)
public_url = "https://catalog.home.example.net"
session_key_file = "/etc/pinakes/secrets/session-key"
idle_timeout = "30m"
step_up_duration = "15m"
auth = "local"                         # or "oidc"
# [web.oidc]
# issuer = "https://id.example.net"
# client_id = "pinakes"
# client_secret_file = "/etc/pinakes/secrets/oidc-client-secret"

# People and groups. Passwords and second factors are set by each person in the UI, never here.
[people.user-1]
display = "User One"
roles = ["person", "operator", "administrator"]   # administrator only takes effect in a step-up session

[people.user-2]
display = "User Two"
roles = ["person"]

[groups.household]
members = ["user-1", "user-2"]

# Ownership: seeds the database on first start. After that, rules and enrollments are changed in the web UI
# (per folder, by its owner or by an administrator in step-up) and this section is only read for new roots.
[ownership]
default_owner = "user-1"               # owns everything no rule claims

[[ownership.rule]]
root = "store"
folder = "people/user-2"            # a folder and everything below it
owner = "user-2"

[[ownership.rule]]
root = "store"
folder = "shared"
owner = "household"

[[ownership.enrollment]]
root = "store"
folder = "people/user-1/projects"
person = "user-2"
as = "reader"                          # co-owner, reader or annotator

# Hosts allowed to send batches, each with the public key its agent uses and the roots it may report.
[hosts.server-1]
key = "/etc/pinakes/agents/server-1.pub"
roots = ["store", "store-writing"]

[hosts.server-2]
key = "/etc/pinakes/agents/server-2.pub"
roots = ["store-snapshots"]

[hosts.laptop-1]
key = "/etc/pinakes/agents/laptop-1.pub"
roots = ["downloads", "pictures"]
uid_map = { 1000 = "user-1" }          # for rules by uid on this host
expected_every = "never"               # often off: shown as stale, never alerted

[lineage]
name_patterns = "/etc/pinakes/name-patterns.toml"   # added to the project's patterns/names.toml
chunk_overlap = 0.6                    # "derived from" at or above this share of chunks
# a similar name links two files ("possible") only with a second signal: sizes within this share of each other,
# the same parent folder name, the other file changed or gone within this many days, or a drop root on either side
name_size_within = 0.05
name_window_days = 7
name_folder_max = 5                    # the folder name counts only if at most this many folders have it
name_size_namesakes = 5                # a similar size counts only if at most this many files have the name

[ingest]
max_batch_time = "1h"                  # a longer batch is stopped and rolled back (a sender hanging up stops it sooner)

[audit]
notify_people = true                   # tell people when an administrator saw their records
keep = "2y"
